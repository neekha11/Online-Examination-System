<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Online Examination System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Online Examination System</h1>
      </div>
    </header>
    <main>
      <section class="welcome-section">
        <div class="container">
          <h2>Welcome</h2>

          <p>Please select your login type to continue.</p>

          <div class="login-options">
            <div class="login-card">
              <h3>Student</h3>
              <p>Login to attend your examination and view your results.</p>

              <a href="student-login.html">
                <button class="login-btn">Student Login</button>
              </a>
            </div>

            <div class="login-card">
              <h3>Admin</h3>
              <p>Login to manage examinations, questions and results.</p>

              <a href="admin-login.html">
                <button class="login-btn">Admin Login</button>
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <p>© 2026 ExamEra. All rights reserved</p>
      </div>
    </footer>
  </body>
</html>
